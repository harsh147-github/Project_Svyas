name: Health Monitor (map growth alarm)

# Daily independent check that the pipeline actually ran and the map has data.
# If the last pipeline run is stale (> 26h) or there are no clusters, this job
# FAILS — GitHub then emails the repo owner. This is the "never silently break
# again" safety net.
#
# IMPORTANT LIMITATION: GitHub auto-disables scheduled workflows after 60
# days of repository inactivity (no commits) — this alarm can silently kill
# itself with no notification at all, which is exactly the failure mode it
# exists to prevent for the rest of the system. Do not treat this as the
# only monitor: point an external prober (BetterStack, UptimeRobot,
# cron-job.org, ...) at GET /api/health?token=<ADMIN_TOKEN> as the primary
# always-on check, and keep this workflow as a secondary/independent one.

on:
  schedule:
    - cron: '0 5 * * *'    # 05:00 UTC daily — ~90 min after the scrape
  workflow_dispatch:

env:
  BASE_URL: https://sushaasan.in

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check /api/health
        env:
          # /api/health's public response used to be the full payload this
          # workflow parses below; it's now `{status, timestamp}` only (an
          # unauthenticated attack roadmap otherwise — missing env vars,
          # whether CRON_SECRET is set, dead scrape sources, AI provider
          # config). The detailed body is ADMIN_TOKEN-gated. Add ADMIN_TOKEN
          # as a repo secret (Settings → Secrets and variables → Actions),
          # matching the ADMIN_TOKEN env var set on Vercel, to get full
          # diagnostics here. The check script below no longer hard-depends
          # on it: without ADMIN_TOKEN it falls back to a plain status=='ok'
          # check against the public payload, so a missing/stale secret
          # degrades diagnostics instead of causing a permanent false-alarm
          # failure.
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          curl -sS -m 30 "$BASE_URL/api/health?token=$ADMIN_TOKEN" -o /tmp/health.json -w 'health HTTP %{http_code}\n'
          cat /tmp/health.json
          node <<'EOF'
          const h = require('/tmp/health.json')
          const fail = (m) => { console.error('::error::' + m); process.exitCode = 1 }

          // /api/health only returns the detailed payload (supabase/counts/pipeline/
          // env/...) when the request authenticates via ADMIN_TOKEN (see lib/auth.ts
          // isAdminAuthed + app/api/health/route.ts). `env` is present on every
          // detailed branch (seed-mode, live/idle, error) and on none of the public
          // ones, so it's a reliable "did we authenticate" signal.
          const authed = h.env !== undefined

          if (!authed) {
            console.warn('::warning::ADMIN_TOKEN repo secret is missing/incorrect (or does not ' +
              'match the ADMIN_TOKEN env var configured on Vercel) — /api/health only returned the ' +
              'public {status, timestamp} shape. Falling back to a status-only check; add/fix the ' +
              'ADMIN_TOKEN repository secret (Settings → Secrets and variables → Actions) for full ' +
              'diagnostics (clusters, pipeline age, scraper yield).')

            if (h.status !== 'ok') {
              fail('Public health status is "' + h.status + '" (expected "ok") — pipeline is degraded. ' +
                'Detailed diagnostics unavailable without ADMIN_TOKEN; check Vercel logs / Supabase directly.')
            } else {
              console.log('✅ Healthy (status=ok) — no detailed diagnostics available without ADMIN_TOKEN')
            }
          } else {
            if (h.supabase !== true) { fail('Supabase not connected in production (status=' + h.status + ')'); }

            const c = h.counts || {}
            if (!(c.clusters > 0)) fail('No clusters on the map (clusters=' + c.clusters + ')')

            const last = h.pipeline && h.pipeline.completed_at
            if (!last) { fail('No completed pipeline run recorded') }
            else {
              const ageH = (Date.now() - new Date(last).getTime()) / 3.6e6
              console.log('last pipeline run ' + ageH.toFixed(1) + 'h ago; clusters=' + c.clusters + ', raw_posts=' + c.raw_posts)
              if (ageH > 26) fail('Pipeline has NOT run in ' + ageH.toFixed(1) + 'h — the map is not refreshing')
            }

            const t = h.last_24h || {}
            console.log('last 24h: scraped=' + t.raw_posts_scraped + ', classified=' + t.posts_classified)

            // Scraper-alive alarm. The cumulative checks above stay green even if
            // every scrape returns nothing (expired Apify token / broken actor),
            // because clusters already exist. Catch that here so a silently-dead
            // scraper surfaces instead of freezing the map behind a green light.
            const s = h.scrape || {}
            if (s.last_run_scraped != null) {
              console.log('last run scraped=' + s.last_run_scraped +
                ' by_source=' + JSON.stringify(s.by_source))
              // Hard fail only on total breakage — every source returned 0. This is
              // unambiguous (not a quiet/saturated day) and won't reintroduce noise.
              if (s.last_run_scraped === 0) {
                fail('Scrapers returned NOTHING on the last run — Apify token/actors likely broken')
              }
              // Individual dead sources are a warning, not a failure: day-rotated
              // sources (gmaps/facebook) are legitimately 0 on their off-days.
              const dead = (s.dead_sources || []).filter((x) => x !== 'gmaps' && x !== 'facebook')
              if (dead.length) console.warn('::warning::Scraper source(s) yielded 0 last run: ' + dead.join(', '))
            }
          }

          if (process.exitCode === 1) console.error('Health check FAILED — see errors above')
          else console.log('✅ Healthy: map is live and refreshing')
          EOF

      - name: TEMP — real mobile-emulated Playwright test against production (branch-only)
        run: |
          npm init -y > /dev/null 2>&1
          npm install --no-save playwright@1 > /tmp/npm-install.log 2>&1
          npx playwright install --with-deps chromium >> /tmp/npm-install.log 2>&1
        shell: bash

      - name: Run production mobile check
        run: |
          node <<'EOF'
          const { chromium, devices } = require('playwright');
          (async () => {
            const pixel = devices['Pixel 5'];
            const b = await chromium.launch();
            const ctx = await b.newContext({ ...pixel });
            const page = await ctx.newPage();
            const client = await ctx.newCDPSession(page);

            const t0 = Date.now();
            await page.goto('https://sushaasan.in/', { waitUntil: 'load', timeout: 45000 });
            const loadMs = Date.now() - t0;
            await page.waitForSelector('.maplibregl-canvas, canvas', { timeout: 20000 }).catch(() => {});
            await page.waitForTimeout(1500);

            const timing = await page.evaluate(() => {
              const nav = performance.getEntriesByType('navigation')[0];
              const paint = performance.getEntriesByType('paint');
              const fcp = paint.find(p => p.name === 'first-contentful-paint');
              return {
                domContentLoaded: nav ? Math.round(nav.domContentLoadedEventEnd) : null,
                transferSize: nav ? nav.transferSize : null,
                firstContentfulPaint: fcp ? Math.round(fcp.startTime) : null,
              };
            });
            console.log('REAL PRODUCTION LOAD (no throttle):', JSON.stringify(timing), 'wall-clock ms:', loadMs);

            await page.screenshot({ path: '/tmp/prod-mobile-home.png' });

            // 4x CPU throttle + real pan gesture, same methodology as local test
            await client.send('Emulation.setCPUThrottlingRate', { rate: 4 });
            const canvas = await page.$('.maplibregl-canvas, canvas');
            if (canvas) {
              const box = await canvas.boundingBox();
              await page.evaluate(() => {
                window.__frameTimes = [];
                function collect(t) { window.__frameTimes.push(t); window.__raf = requestAnimationFrame(collect); }
                window.__raf = requestAnimationFrame(collect);
              });
              const startX = box.x + box.width * 0.7, y = box.y + box.height * 0.5;
              const endX = box.x + box.width * 0.3;
              await client.send('Input.dispatchTouchEvent', { type: 'touchStart', touchPoints: [{ x: startX, y, id: 1 }] });
              for (let i = 1; i <= 20; i++) {
                const x = startX + (endX - startX) * (i / 20);
                await client.send('Input.dispatchTouchEvent', { type: 'touchMove', touchPoints: [{ x, y, id: 1 }] });
                await page.waitForTimeout(16);
              }
              await client.send('Input.dispatchTouchEvent', { type: 'touchEnd', touchPoints: [] });
              await page.waitForTimeout(500);
              const result = await page.evaluate(() => {
                cancelAnimationFrame(window.__raf);
                const times = window.__frameTimes;
                const deltas = [];
                for (let i = 1; i < times.length; i++) deltas.push(times[i] - times[i-1]);
                return { frameCount: times.length, deltas };
              });
              const d = result.deltas;
              if (d.length) {
                const avg = d.reduce((a,b)=>a+b,0)/d.length;
                const max = Math.max(...d);
                const over33 = d.filter(x => x > 33.3).length;
                console.log('REAL PRODUCTION PAN under 4x CPU throttle — frames:', result.frameCount, 'avg ms:', avg.toFixed(1), 'max ms:', max.toFixed(1), 'sub-30fps frames:', over33, '/', d.length);
              } else {
                console.log('No frames captured — canvas may not have been interactive');
              }
            } else {
              console.log('No map canvas found on production homepage');
            }

            await ctx.close();
            await b.close();
          })().catch(e => { console.error('FAILED:', e.message); process.exit(1); });
          EOF
        shell: bash

      - name: Upload production screenshot
        uses: actions/upload-artifact@v4
        with:
          name: prod-mobile-screenshot
          path: /tmp/prod-mobile-home.png
          retention-days: 3
